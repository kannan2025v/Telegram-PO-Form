<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ERP PO Form</title>
  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; color: #333; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; background: #24A1DE; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>Create Purchase Order</h2>
  
  <div class="form-group">
    <label for="po_number">PO Number</label>
    <input type="text" id="po_number" placeholder="e.g. PO-1005" required>
  </div>

  <div class="form-group">
    <label for="supplier">Supplier Name</label>
    <input type="text" id="supplier" placeholder="e.g. Acme Corp" required>
  </div>

  <div class="form-group">
    <label for="item">Item Description</label>
    <input type="text" id="item" placeholder="e.g. 500 units of M12 Bolts" required>
  </div>

  <div class="form-group">
    <label for="quantity">Quantity</label>
    <input type="number" id="quantity" placeholder="e.g. 500" required>
  </div>

  <button id="submitBtn">Submit to ERP</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Opens form full-screen inside Telegram

    document.getElementById('submitBtn').addEventListener('click', () => {
      const poNumber = document.getElementById('po_number').value;
      const supplier = document.getElementById('supplier').value;
      const item = document.getElementById('item').value;
      const quantity = document.getElementById('quantity').value;

      if (!poNumber || !supplier || !item || !quantity) {
        alert("Please fill in all fields.");
        return;
      }

      const payload = {
        po_number: poNumber,
        supplier: supplier,
        item: item,
        quantity: Number(quantity)
      };

      // Send JSON string back to Telegram trigger node in n8n
      tg.sendData(JSON.stringify(payload));
    });
  </script>
</body>
</html>
